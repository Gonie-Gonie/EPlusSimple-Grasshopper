# Paths and symbols in each `upstream` block are exact historical source
# identifiers. Product-owned names in this port are InvisibleDragon and
# SimpleDragon.
- id: deterministic-auto-id
  upstream:
    path: src/epsimple/core/shape.py
    symbol: Surface.__init__
  difference:
    upstream: Python memory-address-based automatic identifiers
    dotnet: deterministic persistent identifiers
  effect:
    engineering_result: none
    raw_idf_text: generated names can differ
  approval: accepted

- id: immutable-conversion
  upstream:
    path: src/epsimple/core/model.py
    symbol: GreenRetrofitModel._dragonize_surface
  difference:
    upstream: temporarily mutates unknown constructions and resets them
    dotnet: resolves constructions on immutable copies
  effect:
    engineering_result: none
  approval: accepted

- id: rhino-7-support
  upstream:
    path: null
    symbol: null
  difference:
    upstream: no Rhino or Grasshopper plugin
    dotnet: multi-targets Rhino 7 (.NET Framework 4.8) and Rhino 8 (.NET 8)
  effect:
    engineering_result: none
    packaging: separate runtime-specific plugin payloads
  approval: user-requested

- id: legacy-people-activity-type-limit
  upstream:
    path: src/idragon/dragon/model.py
    symbol: EnergyModel.create_default_idf
  difference:
    upstream: emits the people-activity Schedule:Constant reference as Real although the declared object is named ScheduleTypeLimits:Real
    dotnet: preserves that authoring text exactly and normalizes the alias only in a disposable validation copy
  effect:
    engineering_result: none
    raw_idf_text: exact upstream text retained
    energyplus: same not-validated warning as pinned Python 0.7.0
    grasshopper_validation: warning instead of a blocking error
  approval: accepted-upstream-parity

- id: legacy-absorption-hot-water-generator-runaway
  upstream:
    path: src/idragon/dragon/hvac.py
    symbol: AbsorptionChiller.to_idf_object
  difference:
    upstream: connects the Chiller:Absorption hot-water generator nodes to a Boiler:HotWater demand branch that reaches runaway plant temperatures whenever a non-zero cooling load dispatches the chiller under EnergyPlus 24.2
    dotnet: preserves that legacy authoring topology for exact SimpleDragon parity, verifies all six compatibility stages at zero cooling load, and does not claim active absorption cooling or generator-energy parity
  effect:
    engineering_result: active absorption cooling is not validated and the legacy topology can terminate EnergyPlus 24.2 under non-zero cooling load
    compatibility_evidence: GRM and IDF parity, zero-cooling runtime parity, and non-zero electric-radiant heating parity remain verified
  approval: accepted-upstream-parity

- id: legacy-ashrae140-internal-source-material-severe
  upstream:
    path: null
    symbol: null
  difference:
    upstream: the pinned ASHRAE 140 modified GRM contains an internal-source construction layer that EnergyPlus 24.2 diagnoses as too thin or highly conductive
    dotnet: preserves the exact fixture material and requires the single normalized Severe diagnostic to match by title and count in both engines
  effect:
    engineering_result: the paired EnergyPlus run completes and its results remain comparable, but the one registered Severe diagnostic must stay visible
    diagnostic_policy: any additional Severe or Fatal diagnostic remains a compatibility failure
  approval: accepted-upstream-fixture-parity

- id: immutable-schedule-apply
  upstream:
    path: src/idragon/dragon/profile.py
    symbol: Schedule.apply
  difference:
    upstream: mutates the schedule by default, permits a mixed ScheduleType assignment, and treats an end date before the start date as an empty no-op range
    dotnet: returns an immutable updated schedule, requires the assigned RuleSet type to match, and rejects a reversed date range
  effect:
    engineering_result: valid same-type date ranges produce the same later-assignment-wins schedule values and Schedule:Compact output
    api_contract: mutation and invalid-input behavior intentionally follow the native immutable and strongly typed C# product interface
  approval: accepted-native-api-adaptation

- id: ruleset-scalar-minimum-upstream-attribute-error
  upstream:
    path: src/idragon/dragon/profile.py
    symbol: RuleSet.element_min
  difference:
    upstream: declares scalar support but reads other.name before dispatch and raises AttributeError for scalar operands
    dotnet: implements the declared scalar element-minimum operation while preserving RuleSet-to-RuleSet behavior
  effect:
    engineering_result: none for model authoring and serialized schedules
    api_contract: the unusable upstream scalar branch is repaired
  approval: accepted-upstream-bug-fix

- id: ruleset-scalar-maximum-upstream-attribute-error
  upstream:
    path: src/idragon/dragon/profile.py
    symbol: RuleSet.element_max
  difference:
    upstream: declares scalar support but reads other.name before dispatch and raises AttributeError for scalar operands
    dotnet: implements the declared scalar element-maximum operation while preserving RuleSet-to-RuleSet behavior
  effect:
    engineering_result: none for model authoring and serialized schedules
    api_contract: the unusable upstream scalar branch is repaired
  approval: accepted-upstream-bug-fix
