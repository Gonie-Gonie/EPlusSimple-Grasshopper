- id: construction-equality-native-null-operand
  upstream:
    path: src/idragon/dragon/construction.py
    symbol: Construction.__eq__
    symbol_hash: sha256:8bf568b5f76ed813063ea04fd2eedf087e8f2525c2be9b9febbdb150a906b019
  difference:
    upstream: directly reads the operand name and layers, so duck-typed operands may compare while null or incompatible operands can raise AttributeError
    dotnet: matches the same supported name and ordered-layer values only for the CLR Construction type and follows native .NET equality by returning false for null or unrelated operands
  effect:
    engineering_result: none for valid typed constructions used in model authoring and EnergyPlus export
    api_contract: invalid-operand equality follows native .NET false semantics instead of preserving the Python AttributeError
    compatibility_evidence: same-type value parity and the exact null-operand difference remain required in a trusted cross-language receipt
  approval: accepted-native-api-adaptation

- id: construction-hash-native-runtime-value
  upstream:
    path: src/idragon/dragon/construction.py
    symbol: Construction.__hash__
    symbol_hash: sha256:5994dd14a598a335d7945a1e39b59d93fd6bed9afbaff1308019b57bf22d0889
  difference:
    upstream: returns the Python 3.12 hash of name as a Python-sized integer whose value depends on PYTHONHASHSEED and the Python runtime
    dotnet: returns the native .NET Int32 ordinal string hash of Name and preserves the same name-only dependency without claiming the same numeric value
  effect:
    engineering_result: none because hash codes do not participate in EnergyPlus model values or serialized engineering results
    api_contract: hash codes are runtime-local and must not be persisted or compared numerically across Python and .NET
    compatibility_evidence: name-only dependency and same-name invariants remain required while exact cross-runtime numeric equality is explicitly excluded
  approval: accepted-native-api-adaptation

