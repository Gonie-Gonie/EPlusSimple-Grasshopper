- id: schedule-type-validation-native-safety-adaptation
  upstream:
    path: src/idragon/dragon/profile.py
    symbol: ScheduleType.validate
    symbol_hash: sha256:b09903103bf95c771eb228f80666fb264e176204c332873795c2d96f86056bcb
  difference:
    upstream: accepts NaN and positive or negative infinity for Real schedules and returns Python integers for successful OnOff validation
    dotnet: rejects non-finite values in the typed ScheduleType and DaySchedule authoring path and normalizes successful strongly typed numeric results to CLR double
  effect:
    engineering_result: finite typed schedule values retain the pinned behavior, while non-finite values are prevented from entering an IDF through the typed schedule path
    api_contract: Real non-finite inputs follow the native engineering safety invariant and OnOff results follow the strongly typed CLR double contract
    compatibility_evidence: all finite, boundary, type, and domain cases plus the three Real safety divergences and four OnOff numeric-kind adaptations remain required in a trusted cross-language receipt
  approval: accepted-native-api-adaptation
