- id: legacy-absorption-hot-water-generator-runaway
  upstream:
    path: src/idragon/dragon/hvac.py
    symbol: AbsorptionChiller.to_idf_object
    symbol_hash: sha256:17d5fb8afe2207a9772bc47b4f5424d740b3df76301f04c9155c0fbd725af969
  difference:
    upstream: connects the Chiller:Absorption hot-water generator nodes to a Boiler:HotWater demand branch that reaches runaway plant temperatures whenever a non-zero cooling load dispatches the chiller under EnergyPlus 24.2
