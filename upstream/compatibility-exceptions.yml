  effect:
    engineering_result: active absorption cooling is not validated and the legacy topology can terminate EnergyPlus 24.2 under non-zero cooling load
    compatibility_evidence: GRM and IDF parity, zero-cooling runtime parity, and non-zero electric-radiant heating parity remain verified
