- id: immutable-schedule-apply
  upstream:
    path: src/idragon/dragon/profile.py
    symbol: Schedule.apply
    symbol_hash: sha256:cac23120005e2cac2c4729c70471a7796840160338fff91e1c49e9670f763ba9
  difference:
    upstream: mutates the schedule by default, permits a mixed ScheduleType assignment, and treats an end date before the start date as an empty no-op range
    dotnet: returns an immutable updated schedule, requires the assigned RuleSet type to match, and rejects a reversed date range
  effect:
    engineering_result: valid same-type date ranges produce the same later-assignment-wins schedule values and Schedule:Compact output
    api_contract: mutation and invalid-input behavior intentionally follow the native immutable and strongly typed C# product interface
  approval: accepted-native-api-adaptation

