name: Build verified local release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-main
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Verify complete Rhino 7+ local candidate
    runs-on: [self-hosted, Windows, X64, rhino7, rhino8, energyplus-24-2, dragons-release]
    timeout-minutes: 180

    steps:
      - name: Check out exact origin main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bind workflow to clean pushed main
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse origin/main).Trim()
          $branch = (git branch --show-current).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or
              $head -notmatch '^[0-9a-f]{40}$' -or
              $head -cne $originMain -or
              $branch -cne 'main' -or
              $status.Count -ne 0) {
            throw 'Release workflow did not check out the exact clean origin/main commit.'
          }
          "sha=$head" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run authoritative complete release gate
        shell: powershell
        run: .\dev.cmd release

      - name: Verify exact non-public release evidence
        shell: powershell
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2.0

          function Test-ExactJsonBoolean {
            param(
              [Parameter(Mandatory = $true)]
              [object] $Object,

              [Parameter(Mandatory = $true)]
              [string] $Name,

              [Parameter(Mandatory = $true)]
              [bool] $Expected
            )

            $property = $Object.PSObject.Properties[$Name]
            return ($null -ne $property -and
              $property.Value -is [bool] -and
              [bool] $property.Value -eq $Expected)
          }

          $gatePath = 'artifacts/release/release-gate.json'
          if (-not (Test-Path -LiteralPath $gatePath -PathType Leaf)) {
            throw "Release gate is missing: '$gatePath'."
          }
          $gate = Get-Content -LiteralPath $gatePath -Raw | ConvertFrom-Json
          $engineering = $gate.verification.engineeringCompatibility
          $exampleGate = $gate.verification.grasshopperExampleGate
          $userGuide = $gate.verification.userGuide
          $food4RhinoMetadata = $gate.verification.food4RhinoMetadata
          $githubRelease = $gate.githubRelease
          $publication = $gate.publication
          if ([string] $gate.schema -cne 'dragons-grasshopper.release-gate.v3' -or
              [string] $gate.status -cne 'passed' -or
              [string] $gate.source.commit -cne $env:EXPECTED_SHA -or
              [string] $gate.source.branch -cne 'main' -or
              -not (Test-ExactJsonBoolean -Object $gate.source -Name 'clean' -Expected $true) -or
              -not (Test-ExactJsonBoolean -Object $gate.source -Name 'pushedToOriginMain' -Expected $true) -or
              [int] $engineering.declaredCaseCount -ne 11 -or
              [int] $engineering.executedCaseCount -ne 11 -or
              [int] $engineering.skippedStageCount -ne 0 -or
              [string] $engineering.status -cne 'passed' -or
              [string] $gate.verification.grasshopperExamples -cne 'passed' -or
              [string] $exampleGate.status -cne 'passed' -or
              [string] $exampleGate.sourceRun -notmatch '^[0-9a-f]{8}$' -or
              [string] $gate.verification.packageCompatibility -cne 'passed' -or
              [string] $userGuide.status -cne 'passed' -or
              [string] $food4RhinoMetadata.status -cne 'passed' -or
              [string] $githubRelease.status -cne 'prepared' -or
              -not (Test-ExactJsonBoolean -Object $publication -Name 'publicPublicationApprovedByOwner' -Expected $true) -or
              [string] $publication.projectLicense -cne 'MIT' -or
              [string] $publication.projectLicenseOwner -cne 'Gonie-Gonie' -or
              [string] $publication.projectLicenseOwnerType -cne 'individual' -or
              [string] $publication.projectLicenseReview -cne 'resolved-2026-08-31' -or
              [string] $publication.publicSupportEmail -cne 'hyeonggon.jo@snu.ac.kr' -or
              [string] $publication.publicSupportEmailReview -cne 'resolved-2026-08-31' -or
              [string] $publication.weatherSource -cne 'https://climate.onebuilding.org/' -or
              -not (Test-ExactJsonBoolean -Object $publication -Name 'tagCreated' -Expected $false) -or
              -not (Test-ExactJsonBoolean -Object $publication -Name 'githubReleaseCreated' -Expected $false) -or
              -not (Test-ExactJsonBoolean -Object $publication -Name 'yakPublished' -Expected $false) -or
              -not (Test-ExactJsonBoolean -Object $publication -Name 'food4RhinoSubmitted' -Expected $false)) {
            throw 'Release gate identity, verification, or non-publication policy is invalid.'
          }

          $expectedDocuments = [ordered] @{
            'documentation/Dragons-Grasshopper-User-Guide-0.1.1.pdf' = $userGuide
            'documentation/Dragons-Grasshopper-Food4Rhino-Metadata-0.1.1.pdf' = $food4RhinoMetadata
          }
          foreach ($expectedDocument in $expectedDocuments.GetEnumerator()) {
            $expectedPath = [string] $expectedDocument.Key
            $record = $expectedDocument.Value
            $documentPath = Join-Path 'artifacts' ($expectedPath -replace '/', '\')
            if ([string] $record.path -cne $expectedPath -or
                [string] $record.sha256 -notmatch '^[0-9a-f]{64}$' -or
                -not (Test-Path -LiteralPath $documentPath -PathType Leaf)) {
              throw "Release gate does not identify the expected OODocs PDF '$expectedPath'."
            }
            $documentItem = Get-Item -LiteralPath $documentPath
            $documentSha256 = (Get-FileHash -LiteralPath $documentPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $documentInputs = @($gate.releaseInputs | Where-Object {
              [string] $_.path -ceq $expectedPath
            })
            if ($documentItem.Length -lt 10kb -or
                $documentSha256 -cne [string] $record.sha256 -or
                $documentInputs.Count -ne 1 -or
                [long] $documentInputs[0].bytes -ne $documentItem.Length -or
                [string] $documentInputs[0].sha256 -cne $documentSha256) {
              throw "The OODocs PDF '$expectedPath' does not match the release input inventory."
            }
          }
          if (@($gate.releaseInputs | Where-Object {
                [string] $_.path -match '(?i)\.pdf$'
              }).Count -ne 2) {
            throw 'The release input inventory must contain exactly two OODocs PDFs.'
          }

          $expectedGitHubAssets = [ordered] @{
            installer = 'Dragons-Grasshopper-0.1.1-Windows-Installer.zip'
            userGuide = 'Dragons-Grasshopper-User-Guide-0.1.1.pdf'
            food4RhinoMetadata = 'Dragons-Grasshopper-Food4Rhino-Metadata-0.1.1.pdf'
            checksums = 'SHA256SUMS.txt'
          }
          $githubAssetRows = @($githubRelease.assets)
          $actualRoles = @($githubAssetRows | ForEach-Object { [string] $_.role } | Sort-Object)
          if ([string] $githubRelease.version -cne '0.1.1' -or
              [string] $githubRelease.directory -cne 'release/github-assets' -or
              [string] $githubRelease.manifest -cne 'release/release-assets-manifest.json' -or
              $githubAssetRows.Count -ne 4 -or
              @($actualRoles | Select-Object -Unique).Count -ne 4 -or
              @(Compare-Object `
                  -ReferenceObject @($expectedGitHubAssets.Keys | Sort-Object) `
                  -DifferenceObject $actualRoles).Count -ne 0) {
            throw 'GitHub release asset metadata is not the exact four-file 0.1.1 contract.'
          }
          foreach ($assetRow in $githubAssetRows) {
            $role = [string] $assetRow.role
            $expectedName = [string] $expectedGitHubAssets[$role]
            $expectedPath = 'release/github-assets/' + $expectedName
            $assetPath = Join-Path 'artifacts' ($expectedPath -replace '/', '\')
            if ([string] $assetRow.fileName -cne $expectedName -or
                [string] $assetRow.path -cne $expectedPath -or
                [string] $assetRow.sha256 -notmatch '^[0-9a-f]{64}$' -or
                -not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "GitHub release asset '$role' has an invalid name, path, hash, or file."
            }
            $assetItem = Get-Item -LiteralPath $assetPath
            $assetSha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long] $assetRow.bytes -ne $assetItem.Length -or
                [string] $assetRow.sha256 -cne $assetSha256) {
              throw "GitHub release asset '$role' differs from its attested bytes."
            }
          }
          $githubGuideRows = @($githubAssetRows | Where-Object { [string] $_.role -ceq 'userGuide' })
          $githubFoodRows = @($githubAssetRows | Where-Object {
            [string] $_.role -ceq 'food4RhinoMetadata'
          })
          if ($githubGuideRows.Count -ne 1 -or
              $githubFoodRows.Count -ne 1 -or
              [string] $githubGuideRows[0].sha256 -cne [string] $userGuide.sha256 -or
              [string] $githubFoodRows[0].sha256 -cne [string] $food4RhinoMetadata.sha256) {
            throw 'The two GitHub release PDFs differ from their postflight-validated OODocs sources.'
          }
          $githubAssetFiles = @(Get-ChildItem -LiteralPath 'artifacts/release/github-assets' -File)
          if ($githubAssetFiles.Count -ne 4 -or
              @(Compare-Object `
                  -ReferenceObject @($expectedGitHubAssets.Values | Sort-Object) `
                  -DifferenceObject @($githubAssetFiles.Name | Sort-Object)).Count -ne 0) {
            throw 'The public GitHub release directory contains an unexpected or missing asset.'
          }
          $githubChecksumPath = 'artifacts/release/github-assets/SHA256SUMS.txt'
          $githubChecksumLines = @(Get-Content -LiteralPath $githubChecksumPath)
          $expectedChecksumLines = @($githubAssetRows | Where-Object {
              [string] $_.role -cne 'checksums'
            } | Sort-Object fileName | ForEach-Object {
              ([string] $_.sha256) + '  ' + ([string] $_.fileName)
            })
          if ($githubChecksumLines.Count -ne 3 -or
              @(Compare-Object -CaseSensitive `
                  -ReferenceObject $expectedChecksumLines `
                  -DifferenceObject $githubChecksumLines).Count -ne 0) {
            throw 'SHA256SUMS.txt does not bind exactly the three downloadable release payloads.'
          }

          $expectedScenarios = @(
            'Rhino7/InvisibleOnly', 'Rhino7/SimpleOnly', 'Rhino7/Both',
            'Rhino8/InvisibleOnly', 'Rhino8/SimpleOnly', 'Rhino8/Both'
          ) | Sort-Object
          $hostRows = @($gate.verification.portableHostGate)
          $actualScenarios = @($hostRows | ForEach-Object {
            ([string] $_.host) + '/' + ([string] $_.scenario)
          } | Sort-Object)
          if ($hostRows.Count -ne 6 -or
              @($actualScenarios | Select-Object -Unique).Count -ne 6 -or
              @(Compare-Object -ReferenceObject $expectedScenarios -DifferenceObject $actualScenarios).Count -ne 0 -or
              @($hostRows | Where-Object {
                [int] $_.reopenedObjects -lt 1 -or
                @($_.portableArchives).Count -lt 1 -or
                @($_.loadedPlugins).Count -lt 1
              }).Count -ne 0) {
            throw 'Release gate does not attest all six real Rhino package-host scenarios.'
          }

          $checksumPath = 'artifacts/release/checksums.sha256'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Release checksum inventory is missing: '$checksumPath'."
          }
          $checksumLines = @(Get-Content -LiteralPath $checksumPath)
          function Assert-ExampleEvidenceFile {
            param(
              [Parameter(Mandatory = $true)] [string] $Report,
              [Parameter(Mandatory = $true)] [string] $ExpectedSha256
            )

            if (-not $Report.StartsWith(
                  'release/grasshopper-example-gate/',
                  [System.StringComparison]::Ordinal) -or
                $Report.Contains('..') -or
                $Report.Contains('\') -or
                $ExpectedSha256 -notmatch '^[0-9a-f]{64}$') {
              throw "Grasshopper example evidence has an unsafe path or hash: '$Report'."
            }
            $artifactPath = Join-Path 'artifacts' ($Report -replace '/', '\')
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Grasshopper example evidence is missing: '$artifactPath'."
            }
            $actualSha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) {
              throw "Grasshopper example evidence hash changed: '$artifactPath'."
            }
            $checksumRelative = $Report.Substring('release/'.Length)
            if ($checksumLines -notcontains ($ExpectedSha256 + '  ' + $checksumRelative)) {
              throw "Release checksum inventory does not bind '$checksumRelative'."
            }
            return $artifactPath
          }

          $expectedExampleReports = @{
            Rhino7 = 'release/grasshopper-example-gate/rhino7-summary.json'
            Rhino8 = 'release/grasshopper-example-gate/rhino8-summary.json'
          }
          $exampleRows = @($exampleGate.hosts)
          $actualExampleHosts = @($exampleRows | ForEach-Object { [string] $_.host } | Sort-Object)
          if ($exampleRows.Count -ne 2 -or
              @($actualExampleHosts | Select-Object -Unique).Count -ne 2 -or
              @(Compare-Object `
                  -ReferenceObject @('Rhino7', 'Rhino8') `
                  -DifferenceObject $actualExampleHosts).Count -ne 0) {
            throw 'Release gate does not attest exactly one Rhino 7 and one Rhino 8 example summary.'
          }
          foreach ($row in $exampleRows) {
            $host = [string] $row.host
            $expectedReport = [string] $expectedExampleReports[$host]
            if ([string] $row.action -cne 'Validate' -or
                [int] $row.definitionCount -ne 8 -or
                [int] $row.modelCount -ne 2 -or
                [string] $row.report -cne $expectedReport) {
              throw "Release example evidence metadata is invalid for '$host'."
            }
            $summaryPath = Assert-ExampleEvidenceFile `
              -Report $expectedReport `
              -ExpectedSha256 ([string] $row.sha256)
            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            if ([string] $summary.schema -cne 'dragons-grasshopper.examples.v3' -or
                [string] $summary.host -cne $host -or
                [string] $summary.action -cne 'Validate' -or
                @($summary.definitions).Count -ne 8 -or
                @($summary.models).Count -ne 2) {
              throw "Copied Grasshopper example summary is invalid for '$host'."
            }
          }

          $expectedMarkers = @{
            'PASS.txt' = 'release/grasshopper-example-gate/PASS.txt'
            'ENERGYPLUS-WORKFLOW-PASS.txt' = 'release/grasshopper-example-gate/ENERGYPLUS-WORKFLOW-PASS.txt'
          }
          $markerRows = @($exampleGate.markers)
          $actualMarkers = @($markerRows | ForEach-Object { [string] $_.name } | Sort-Object)
          if ($markerRows.Count -ne 2 -or
              @($actualMarkers | Select-Object -Unique).Count -ne 2 -or
              @(Compare-Object `
                  -ReferenceObject @($expectedMarkers.Keys | Sort-Object) `
                  -DifferenceObject $actualMarkers).Count -ne 0) {
            throw 'Release gate does not attest the exact two Grasshopper example pass markers.'
          }
          foreach ($marker in $markerRows) {
            $name = [string] $marker.name
            $expectedReport = [string] $expectedMarkers[$name]
            if ([string] $marker.report -cne $expectedReport) {
              throw "Release example marker metadata is invalid for '$name'."
            }
            $null = Assert-ExampleEvidenceFile `
              -Report $expectedReport `
              -ExpectedSha256 ([string] $marker.sha256)
          }

      - name: Upload non-distributable release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ steps.source.outputs.sha || github.sha }}
          path: |
            artifacts/release/*.json
            artifacts/release/*.sha256
            artifacts/release/grasshopper-example-gate/*.json
            artifacts/release/grasshopper-example-gate/*.txt
            artifacts/release/portable-host-gate/*.json
            artifacts/reports/*.json
            artifacts/documentation/*.pdf
            temp/logs/**/*.log
            temp/reference/logs/**/*.log
            temp/compatibility/logs/**/*.log
          if-no-files-found: warn
          retention-days: 30

      # This workflow intentionally builds and verifies a local candidate only.
      # This workflow does not create a tag, GitHub Release, Yak publication,
      # Food4Rhino submission, or uploaded binary artifact. The exact four future
      # GitHub Release assets remain only on the protected self-hosted runner.
