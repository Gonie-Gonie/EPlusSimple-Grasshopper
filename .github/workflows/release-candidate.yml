name: Build verified local release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-main
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Verify complete Rhino 7+ local candidate
    runs-on: [self-hosted, Windows, X64, rhino7, rhino8, energyplus-24-2, dragons-release]
    timeout-minutes: 180
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out exact origin main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bind workflow to clean pushed main
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse origin/main).Trim()
          $branch = (git branch --show-current).Trim()
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or
              $head -notmatch '^[0-9a-f]{40}$' -or
              $head -cne $originMain -or
              $branch -cne 'main' -or
              $status.Count -ne 0) {
            throw 'Release workflow did not check out the exact clean origin/main commit.'
          }
          "sha=$head" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run authoritative complete release gate
        shell: powershell
        run: .\dev.cmd release

      - name: Verify exact non-public release evidence
        shell: powershell
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gatePath = 'artifacts/release/release-gate.json'
          if (-not (Test-Path -LiteralPath $gatePath -PathType Leaf)) {
            throw "Release gate is missing: '$gatePath'."
          }
          $gate = Get-Content -LiteralPath $gatePath -Raw | ConvertFrom-Json
          $engineering = $gate.verification.engineeringCompatibility
          $exampleGate = $gate.verification.grasshopperExampleGate
          $publication = $gate.publication
          if ([string] $gate.schema -cne 'goniegonie.dragons-grasshopper.release-gate.v1' -or
              [string] $gate.status -cne 'passed' -or
              [string] $gate.source.commit -cne $env:EXPECTED_SHA -or
              [string] $gate.source.branch -cne 'main' -or
              -not [bool] $gate.source.clean -or
              -not [bool] $gate.source.pushedToOriginMain -or
              [int] $engineering.declaredCaseCount -ne 11 -or
              [int] $engineering.executedCaseCount -ne 11 -or
              [int] $engineering.skippedStageCount -ne 0 -or
              [string] $engineering.status -cne 'passed' -or
              [string] $gate.verification.grasshopperExamples -cne 'passed' -or
              [string] $exampleGate.status -cne 'passed' -or
              [string] $exampleGate.sourceRun -notmatch '^[0-9a-f]{8}$' -or
              [string] $gate.verification.packageCompatibility -cne 'passed' -or
              [bool] $publication.publicPublicationAuthorized -or
              [bool] $publication.tagCreated -or
              [bool] $publication.githubReleaseCreated -or
              [bool] $publication.yakPublished) {
            throw 'Release gate identity, verification, or non-publication policy is invalid.'
          }

          $expectedScenarios = @(
            'Rhino7/InvisibleOnly', 'Rhino7/SimpleOnly', 'Rhino7/Both',
            'Rhino8/InvisibleOnly', 'Rhino8/SimpleOnly', 'Rhino8/Both'
          ) | Sort-Object
          $hostRows = @($gate.verification.portableHostGate)
          $actualScenarios = @($hostRows | ForEach-Object {
            ([string] $_.host) + '/' + ([string] $_.scenario)
          } | Sort-Object)
          if ($hostRows.Count -ne 6 -or
              @($actualScenarios | Select-Object -Unique).Count -ne 6 -or
              @(Compare-Object -ReferenceObject $expectedScenarios -DifferenceObject $actualScenarios).Count -ne 0 -or
              @($hostRows | Where-Object {
                [int] $_.reopenedObjects -lt 1 -or
                @($_.portableArchives).Count -lt 1 -or
                @($_.loadedPlugins).Count -lt 1
              }).Count -ne 0) {
            throw 'Release gate does not attest all six real Rhino package-host scenarios.'
          }

          $checksumPath = 'artifacts/release/checksums.sha256'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Release checksum inventory is missing: '$checksumPath'."
          }
          $checksumLines = @(Get-Content -LiteralPath $checksumPath)
          function Assert-ExampleEvidenceFile {
            param(
              [Parameter(Mandatory = $true)] [string] $Report,
              [Parameter(Mandatory = $true)] [string] $ExpectedSha256
            )

            if (-not $Report.StartsWith(
                  'release/grasshopper-example-gate/',
                  [System.StringComparison]::Ordinal) -or
                $Report.Contains('..') -or
                $Report.Contains('\') -or
                $ExpectedSha256 -notmatch '^[0-9a-f]{64}$') {
              throw "Grasshopper example evidence has an unsafe path or hash: '$Report'."
            }
            $artifactPath = Join-Path 'artifacts' ($Report -replace '/', '\')
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Grasshopper example evidence is missing: '$artifactPath'."
            }
            $actualSha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $ExpectedSha256) {
              throw "Grasshopper example evidence hash changed: '$artifactPath'."
            }
            $checksumRelative = $Report.Substring('release/'.Length)
            if ($checksumLines -notcontains ($ExpectedSha256 + '  ' + $checksumRelative)) {
              throw "Release checksum inventory does not bind '$checksumRelative'."
            }
            return $artifactPath
          }

          $expectedExampleReports = @{
            Rhino7 = 'release/grasshopper-example-gate/rhino7-summary.json'
            Rhino8 = 'release/grasshopper-example-gate/rhino8-summary.json'
          }
          $exampleRows = @($exampleGate.hosts)
          $actualExampleHosts = @($exampleRows | ForEach-Object { [string] $_.host } | Sort-Object)
          if ($exampleRows.Count -ne 2 -or
              @($actualExampleHosts | Select-Object -Unique).Count -ne 2 -or
              @(Compare-Object `
                  -ReferenceObject @('Rhino7', 'Rhino8') `
                  -DifferenceObject $actualExampleHosts).Count -ne 0) {
            throw 'Release gate does not attest exactly one Rhino 7 and one Rhino 8 example summary.'
          }
          foreach ($row in $exampleRows) {
            $host = [string] $row.host
            $expectedReport = [string] $expectedExampleReports[$host]
            if ([string] $row.action -cne 'Validate' -or
                [int] $row.definitionCount -ne 8 -or
                [int] $row.modelCount -ne 2 -or
                [string] $row.report -cne $expectedReport) {
              throw "Release example evidence metadata is invalid for '$host'."
            }
            $summaryPath = Assert-ExampleEvidenceFile `
              -Report $expectedReport `
              -ExpectedSha256 ([string] $row.sha256)
            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            if ([string] $summary.schema -cne 'goniegonie.dragons-grasshopper.examples.v3' -or
                [string] $summary.host -cne $host -or
                [string] $summary.action -cne 'Validate' -or
                @($summary.definitions).Count -ne 8 -or
                @($summary.models).Count -ne 2) {
              throw "Copied Grasshopper example summary is invalid for '$host'."
            }
          }

          $expectedMarkers = @{
            'PASS.txt' = 'release/grasshopper-example-gate/PASS.txt'
            'ENERGYPLUS-WORKFLOW-PASS.txt' = 'release/grasshopper-example-gate/ENERGYPLUS-WORKFLOW-PASS.txt'
          }
          $markerRows = @($exampleGate.markers)
          $actualMarkers = @($markerRows | ForEach-Object { [string] $_.name } | Sort-Object)
          if ($markerRows.Count -ne 2 -or
              @($actualMarkers | Select-Object -Unique).Count -ne 2 -or
              @(Compare-Object `
                  -ReferenceObject @($expectedMarkers.Keys | Sort-Object) `
                  -DifferenceObject $actualMarkers).Count -ne 0) {
            throw 'Release gate does not attest the exact two Grasshopper example pass markers.'
          }
          foreach ($marker in $markerRows) {
            $name = [string] $marker.name
            $expectedReport = [string] $expectedMarkers[$name]
            if ([string] $marker.report -cne $expectedReport) {
              throw "Release example marker metadata is invalid for '$name'."
            }
            $null = Assert-ExampleEvidenceFile `
              -Report $expectedReport `
              -ExpectedSha256 ([string] $marker.sha256)
          }

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ steps.source.outputs.sha || github.sha }}
          path: |
            artifacts/release/
            artifacts/reports/
            temp/logs/
            temp/reference/logs/
            temp/compatibility/logs/
            temp/e/
            temp/grasshopper-smoke/
            temp/release-candidate/
          if-no-files-found: warn
          retention-days: 30

      - name: Attest packaged binaries
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/packages/**/*.yak
            artifacts/packages/**/*-portable-plugin-win.zip
            artifacts/packages/checksums.sha256

      - name: Upload complete verified local candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dragons-local-candidate-${{ steps.source.outputs.sha }}
          path: |
            artifacts/release/
            artifacts/packages/
            artifacts/reports/
          if-no-files-found: error
          retention-days: 30
