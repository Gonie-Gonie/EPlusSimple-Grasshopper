name: Check upstream drift

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Validate and classify upstream drift
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.7
          check-latest: false

      - name: Run focused tracker tests
        shell: powershell
        run: .\tests\UpstreamTracker\run-tests.cmd

      - name: Validate tracking inputs
        shell: powershell
        run: .\dev.cmd upstream validate

      - name: Materialize pinned and current source trees
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath 'upstream/upstream.lock.json' -Raw | ConvertFrom-Json
          $work = 'temp/upstream-tracker/workflow'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          git clone --filter=blob:none --no-checkout $lock.repository "$work/baseline"
          git -C "$work/baseline" checkout --detach $lock.commit
          git clone --filter=blob:none --no-checkout $lock.repository "$work/current"
          git -C "$work/current" checkout --detach "origin/$($lock.branch)"

      - name: Generate deterministic drift report
        shell: powershell
        run: |
          .\dev.cmd upstream compare `
            --baseline-source temp/upstream-tracker/workflow/baseline `
            --current-source temp/upstream-tracker/workflow/current `
            --output-dir temp/upstream-tracker/report `
            --require-verified-pin `
            --fail-on-drift `
            --fail-on-unmapped

      - name: Upload upstream drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dragons-upstream-drift-${{ github.run_id }}
          path: temp/upstream-tracker/report/
          if-no-files-found: warn
          retention-days: 30
