name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Rhino 7+
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned EnergyPlus runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/energyplus/24.2.0-94a887817b
          key: energyplus-windows-24.2.0-94a887817b-26c7c22b731f54031626750284c8b613fb8f03c3aa56b6bc7ec65b6bf8668df1

      - name: Bootstrap pinned local environment
        shell: powershell
        run: .\dev.cmd setup -InstallEnergyPlus -RequireEnergyPlus

      - name: Build, test, and stage all plugin targets
        shell: powershell
        run: .\dev.cmd build -NoRestore -RequireEnergyPlus

      - name: Build exhaustive PDF user guide from runtime metadata
        shell: powershell
        run: .\dev.cmd docs

      - name: Upload staged plugins and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dragon-plugins-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ github.sha }}
          path: |
            temp/test-results/
            temp/logs/
          if-no-files-found: warn
          retention-days: 14

  python-reference:
    name: Verify Python oracle and paired EnergyPlus
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select exact Python oracle
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.7
          check-latest: false

      - name: Run compatibility reporter regression tests
        shell: cmd
        run: tests\CompatibilityRunner\run-tests.cmd

      - name: Restore pinned EnergyPlus runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/energyplus/24.2.0-94a887817b
          key: energyplus-windows-24.2.0-94a887817b-26c7c22b731f54031626750284c8b613fb8f03c3aa56b6bc7ec65b6bf8668df1

      - name: Bootstrap local configuration
        shell: powershell
        run: .\dev.cmd setup -SkipPythonInstall -SkipPythonEnvironment -SkipRestore -InstallEnergyPlus -RequireEnergyPlus

      - name: Reproduce and verify compatibility fixtures
        shell: powershell
        run: .\dev.cmd reference -Mode Verify

      # Reference preparation above is reused. Omitting -NoRestore limits the
      # second job to restoring the compatibility runner's project graph rather
      # than restoring the full solution a second time.
      - name: Run strict eleven-case paired EnergyPlus climate gate
        shell: powershell
        run: .\dev.cmd compatibility -SkipReferencePreparation

      - name: Require exact clean 11x6 compatibility evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = 'artifacts/reports/engineering-compatibility.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Engineering compatibility report is missing: '$reportPath'."
          }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.cases)
          if ([string] $report.schema -cne 'dragons.engineering-compatibility-report.v1' -or
              -not [bool] $report.passed -or
              [int] $report.declared_case_count -ne 11 -or
              [int] $report.executed_case_count -ne 11 -or
              [int] $report.passed_case_count -ne 11 -or
              [int] $report.failed_case_count -ne 0 -or
              [int] $report.skip_count -ne 0 -or
              $cases.Count -ne 11 -or
              [int] ($cases | ForEach-Object { @($_.executed_stages).Count } | Measure-Object -Sum).Sum -ne 66 -or
              @($cases | Where-Object {
                -not [bool] $_.passed -or
                [int] $_.skip_count -ne 0 -or
                @($_.skipped_stages).Count -ne 0
              }).Count -ne 0) {
            throw 'Engineering compatibility report is incomplete, skipped, or failed.'
          }

          $requiredCaseIds = @(
            'ashrae-140-modified',
            'two-zone-one-sided-adjacency-shared-hp',
            'screw-chiller-closed-two-speed-fcu',
            'packaged-erv-pv-openings',
            'packaged-erv-pv-openings--tampa',
            'packaged-erv-pv-openings--golden',
            'packaged-erv-pv-openings--san-francisco',
            'geothermal-heat-pump-ahu',
            'boiler-heating-fuel-shared-matrix',
            'absorption-default-explicit-electric-radiant',
            'district-shared-fcu-radiator-radiant-dhw'
          ) | Sort-Object
          $caseIds = @($cases | ForEach-Object { [string] $_.id } | Sort-Object)
          if (@($caseIds | Select-Object -Unique).Count -ne 11 -or
              @(Compare-Object -ReferenceObject $requiredCaseIds -DifferenceObject $caseIds).Count -ne 0) {
            throw 'Engineering compatibility report does not contain the exact eleven case IDs.'
          }

          $requiredStages = @(
            'grm_cross_read',
            'authoring_idf',
            'expanded_idf',
            'energyplus',
            'grr',
            'warnings'
          ) | Sort-Object
          foreach ($case in $cases) {
            $declared = @($case.declared_stages | ForEach-Object { [string] $_ } | Sort-Object)
            $executed = @($case.executed_stages | ForEach-Object { [string] $_ } | Sort-Object)
            if (@(Compare-Object -ReferenceObject $requiredStages -DifferenceObject $declared).Count -ne 0 -or
                @(Compare-Object -ReferenceObject $requiredStages -DifferenceObject $executed).Count -ne 0) {
              throw "Engineering case '$($case.id)' did not declare and execute the exact six stages."
            }
          }

          $provenance = $report.port_provenance
          if ($null -eq $provenance -or
              [string] $provenance.schema -cne 'dragons.engineering-port-provenance.v1' -or
              [string] $provenance.git.commit -cne $env:GITHUB_SHA -or
              $provenance.git.dirty -isnot [bool] -or
              [bool] $provenance.git.dirty) {
            throw 'Engineering compatibility evidence is not bound to the clean CI commit.'
          }

      - name: Upload CI compatibility evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-compatibility-${{ github.sha }}
          path: |
            artifacts/reports/engineering-compatibility.json
            temp/compatibility/logs/
            temp/reference/logs/
            temp/logs/
          if-no-files-found: warn
          retention-days: 14
